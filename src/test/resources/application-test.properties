# Placeholder values so the Spring context can start without external services.
spring.application.name=chat-test
server.port=0

spring.mongodb.uri=mongodb://localhost:27017/chat-test
spring.data.mongodb.auto-index-creation=false

spring.rsocket.server.mapping-path=/rsocket
spring.rsocket.server.transport=websocket

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs

logging.level.root=WARN

# No broker on a workstation: in-process delivery, which is correct at one instance.
chat.broadcast.mode=local

# Nor a consumer of the event groups: EventGroupConsumerTest drives it directly.
chat.event-groups.enabled=false
# Nor of the date notices: EventDateFixedConsumerTest drives it directly.
chat.event-notices.enabled=false
# Nor of the account deletions: UserDeletedConsumerTest drives it directly.
chat.user-deleted.enabled=false
chat.friendship-state.enabled=false
# Nor the reconciliation loop: DeletedUsersReconciliationLoopTest drives it directly.
app.account-erasure.reconciliation.enabled=false

# No wely-media in the unit tests: MediaApiAdapterTest drives the adapter against a stub exchange.
app.media-api.url=http://localhost:8085
app.media-api.secret=test-secret
