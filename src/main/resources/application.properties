spring.application.name=chat
server.port=8084

# Production configuration
spring.data.mongodb.uri=${MONGODB_URI}
# Creates the unique (conversationId, bucketIndex) index that makes concurrent
# bucket rollover safe. Off by default since Spring Boot 3.
spring.data.mongodb.auto-index-creation=true

# RSocket config
spring.rsocket.server.mapping-path=/rsocket
spring.rsocket.server.transport=websocket

# Keycloak Hybrid Discovery/Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

# FrameLogger at DEBUG logged every RSocket frame, which means the body of every
# private message reached the cluster logs. The two TRACE lines were nearly as
# expensive. Raise them per-pod through an environment variable when debugging:
#   LOGGING_LEVEL_IO_RSOCKET_FRAMELOGGER=DEBUG
logging.level.root=INFO
logging.level.com.calendar.chat=INFO
logging.level.io.rsocket=WARN
logging.level.org.springframework.messaging.rsocket=WARN
logging.level.org.springframework.security.rsocket=WARN
# Framework-raised errors answer in the same RFC 7807 shape as GlobalErrorHandler's.
spring.webflux.problemdetails.enabled=true

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed. Everything else — env, beans, heapdump,
# loggers — stays off: those endpoints describe the internals and, on a cluster
# without a NetworkPolicy, anything inside can reach them.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   /actuator/health/liveness  — is the process broken beyond recovery?
#   /actuator/health/readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true
