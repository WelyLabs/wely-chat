spring.application.name=chat
server.port=8084

# Production configuration
spring.mongodb.uri=${MONGODB_URI}
# Creates the unique (conversationId, bucketIndex) index that makes concurrent
# bucket rollover safe. Off by default since Spring Boot 3.
spring.data.mongodb.auto-index-creation=true

# RSocket config
spring.rsocket.server.mapping-path=/rsocket
spring.rsocket.server.transport=websocket

# Keycloak Hybrid Discovery/Validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}

# FrameLogger at DEBUG logged every RSocket frame, which means the body of every
# private message reached the cluster logs. The two TRACE lines were nearly as
# expensive. Raise them per-pod through an environment variable when debugging:
#   LOGGING_LEVEL_IO_RSOCKET_FRAMELOGGER=DEBUG
logging.level.root=INFO
logging.level.com.calendar.chat=INFO
logging.level.io.rsocket=WARN
logging.level.org.springframework.messaging.rsocket=WARN
logging.level.org.springframework.security.rsocket=WARN
# --- Message fan-out --------------------------------------------------------
# local: in-process delivery, correct at one replica only.
# kafka: fans out across instances. See KafkaMessageBroadcaster for why each
# instance must be its own consumer group.
chat.broadcast.mode=${CHAT_BROADCAST_MODE:kafka}

# A fresh group per process, so every instance receives every record instead of
# Kafka handing each one to a single member. The topic must therefore be
# short-retention: these groups are disposable and their offsets pile up.
chat.broadcast.instance-id=${HOSTNAME:${random.uuid}}

spring.cloud.function.definition=messageBroadcast;eventGroup
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BOOTSTRAP_SERVER}
spring.cloud.stream.kafka.binder.auto-create-topics=false

# Overridable per environment, so two environments sharing a broker never read each other's
# records: the user ids come from the same Keycloak realm, so a stray record would reach a real
# subscriber. The topic has to exist beforehand: auto-create-topics is off.
chat.broadcast.topic=${CHAT_BROADCAST_TOPIC:MESSAGE_BROADCAST}

spring.cloud.stream.bindings.messageBroadcast-out-0.destination=${chat.broadcast.topic}
spring.cloud.stream.bindings.messageBroadcast-out-0.content-type=application/json
spring.cloud.stream.bindings.messageBroadcast-in-0.destination=${chat.broadcast.topic}
spring.cloud.stream.bindings.messageBroadcast-in-0.content-type=application/json
spring.cloud.stream.bindings.messageBroadcast-in-0.group=chat-${chat.broadcast.instance-id}
# A named group starts from the earliest offset by default: each new pod, a new group, replayed the
# whole topic and redelivered old messages live. A live channel starts from now.
spring.cloud.stream.kafka.bindings.messageBroadcast-in-0.consumer.start-offset=latest

# --- Event groups -------------------------------------------------------------
# wely-events sends each event's member list on EVENT_GROUP_CHANGED; the event's group
# conversation follows it. One group for all instances: each record is applied once.
chat.event-groups.enabled=${CHAT_EVENT_GROUPS_ENABLED:true}
spring.cloud.stream.bindings.eventGroup-in-0.destination=EVENT_GROUP_CHANGED
spring.cloud.stream.bindings.eventGroup-in-0.content-type=application/json
spring.cloud.stream.bindings.eventGroup-in-0.group=chat-service-group

# Framework-raised errors answer in the same RFC 7807 shape as GlobalErrorHandler's.
spring.webflux.problemdetails.enabled=true

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed. Everything else — env, beans, heapdump,
# loggers — stays off: those endpoints describe the internals and, on a cluster
# without a NetworkPolicy, anything inside can reach them.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   /actuator/health/liveness  — is the process broken beyond recovery?
#   /actuator/health/readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true

# --- Photos -----------------------------------------------------------------
# Garage in the cluster, through the S3 API, in a bucket of its own. Uploads use the internal
# Service; signed URLs are computed for the public hostname, since a signature covers the host.
app.media.internal-endpoint=${MEDIA_INTERNAL_ENDPOINT}
app.media.public-endpoint=${MEDIA_PUBLIC_ENDPOINT}
app.media.region=${MEDIA_REGION:garage}
app.media.bucket=${MEDIA_BUCKET:wely-chat-media}
app.media.access-key=${MEDIA_ACCESS_KEY}
app.media.secret-key=${MEDIA_SECRET_KEY}
# A photo is held in memory, not spilled to disk: the root filesystem is read-only and the
# controller refuses anything above 10 MB anyway.
spring.webflux.multipart.max-in-memory-size=11MB
