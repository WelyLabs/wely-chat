# Development profile for local testing
spring.mongodb.uri=mongodb://localhost:27017/chatdb
# Creates the unique (conversationId, bucketIndex) index that makes concurrent
# bucket rollover safe. Off by default since Spring Boot 3.
spring.data.mongodb.auto-index-creation=true

# Keycloak public issuer for dev
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/calendar-app

# RSocket dev config
spring.rsocket.server.mapping-path=/rsocket
spring.rsocket.server.transport=websocket

# The dev profile may be verbose: it only ever runs on a workstation.
logging.level.com.calendar.chat=DEBUG

# No broker on a workstation: in-process delivery, which is correct at one instance.
chat.broadcast.mode=local
